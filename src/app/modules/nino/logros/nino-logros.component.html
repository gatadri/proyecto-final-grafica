<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold"><i class="fas fa-trophy text-warning me-2"></i>Mis Logros</h4>
    <a routerLink="/nino/dashboard" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver</a>
  </div>

  <div *ngIf="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

  <div *ngIf="!loading">
    <div class="mb-3">
      <span class="badge bg-success fs-6">{{ logrosObtenidos.length }} obtenidos</span>
      <span class="badge bg-secondary fs-6 ms-2">{{ todoLogros.length - logrosObtenidos.length }} por desbloquear</span>
    </div>

    <div class="row g-3">
      <div *ngFor="let l of todoLogros" class="col-md-4 col-6">
        <div class="card text-center h-100" [class.border-warning]="tieneLogro(l.id)" [class.opacity-50]="!tieneLogro(l.id)">
          <div class="card-body">
            <i class="fas fa-{{ l.icono }} fa-3x mb-2"
               [class.text-warning]="l.tipo==='oro'    && tieneLogro(l.id)"
               [class.text-secondary]="l.tipo==='plata' && tieneLogro(l.id)"
               [class.text-danger]="l.tipo==='bronce'  && tieneLogro(l.id)"
               [class.text-muted]="!tieneLogro(l.id)"></i>
            <h6 class="fw-bold">{{ l.nombre }}</h6>
            <small class="text-muted">{{ l.descripcion }}</small>
            <div class="mt-2">
              <span *ngIf="tieneLogro(l.id)" class="badge"
                [class.bg-warning]="l.tipo==='oro'"
                [class.bg-secondary]="l.tipo==='plata'"
                [class.bg-danger]="l.tipo==='bronce'">
                {{ l.tipo | titlecase }}
              </span>
              <span *ngIf="!tieneLogro(l.id)" class="badge bg-light text-dark">
                <i class="fas fa-lock me-1"></i>Bloqueado
              </span>
            </div>
            <small *ngIf="tieneLogro(l.id)" class="text-muted d-block mt-1">
              <i class="fas fa-calendar me-1"></i>{{ getFechaLogro(l.id) }}
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
