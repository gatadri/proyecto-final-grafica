<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold"><i class="fas fa-trophy text-warning me-2"></i>Mis Logros</h4>
    <a routerLink="/nino/dashboard" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver</a>
  </div>

  <div *ngIf="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

  <div *ngIf="!loading" class="row g-3">
    <div *ngFor="let l of logros" class="col-md-4 col-6">
      <div class="card text-center h-100">
        <div class="card-body">
          <i class="fas fa-{{ l.icono ?? 'medal' }} fa-3x mb-2"
             [class.text-warning]="l.tipo==='oro'"
             [class.text-secondary]="l.tipo==='plata'"
             [class.text-danger]="l.tipo==='bronce'"></i>
          <h6 class="fw-bold">{{ l.nombre }}</h6>
          <small class="text-muted">{{ l.descripcion }}</small>
          <div class="mt-2">
            <span class="badge"
              [class.bg-warning]="l.tipo==='oro'"
              [class.bg-secondary]="l.tipo==='plata'"
              [class.bg-danger]="l.tipo==='bronce'">
              {{ l.tipo | titlecase }}
            </span>
          </div>
          <small *ngIf="l.pivot" class="text-muted d-block mt-1">
            <i class="fas fa-calendar me-1"></i>{{ l.pivot.fecha_obtenido | date:'dd/MM/yyyy' }}
          </small>
        </div>
      </div>
    </div>
    <div *ngIf="logros.length === 0" class="col-12 text-center py-5 text-muted">
      <i class="fas fa-trophy fa-4x mb-3"></i>
      <p>Aún no tienes logros. ¡Completa tareas para ganarlos!</p>
    </div>
  </div>
</div>
