<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%)">

  <div *ngIf="loading" class="text-white text-center">
    <div class="spinner-border mb-3"></div><p>Preparando ejercicios...</p>
  </div>

  <!-- Terminado -->
  <div *ngIf="!loading && terminado" class="card text-center shadow-lg" style="width: 420px">
    <div class="card-body p-5">
      <i class="fas fa-dumbbell fa-4x text-success mb-3"></i>
      <h3 class="fw-bold">¡Práctica completada!</h3>
      <div class="p-3 rounded mb-4" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed)">
        <h2 class="text-warning fw-bold mb-0">+{{ puntosGanados }}</h2>
        <small class="text-white">monedas ganadas</small>
      </div>
      <div class="d-grid gap-2">
        <button (click)="reiniciar()" class="btn btn-success btn-lg">
          <i class="fas fa-redo me-2"></i>Practicar de nuevo
        </button>
        <a routerLink="/nino/dashboard" class="btn btn-outline-secondary">
          <i class="fas fa-home me-2"></i>Volver al inicio
        </a>
      </div>
    </div>
  </div>

  <!-- Ejercicio -->
  <div *ngIf="!loading && !terminado && ejercicio" class="card shadow-lg" style="width: 480px">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between mb-3">
        <small class="text-muted">Ejercicio {{ actual + 1 }} de {{ ejercicios.length }}</small>
        <small class="text-muted"><i class="fas fa-coins text-warning me-1"></i>{{ puntosGanados }} ganadas</small>
      </div>
      <div class="progress mb-4" style="height: 8px">
        <div class="progress-bar bg-success" [style.width.%]="(actual / ejercicios.length) * 100"></div>
      </div>

      <h5 class="fw-bold text-center mb-4">{{ ejercicio.pregunta }}</h5>

      <div class="mb-3">
        <input type="text" [(ngModel)]="respuesta" class="form-control form-control-lg text-center"
               placeholder="Tu respuesta..." (keyup.enter)="responder()" [disabled]="!!feedback">
      </div>

      <div *ngIf="feedback" class="alert mb-3"
           [class.alert-success]="feedback.correcto"
           [class.alert-danger]="!feedback.correcto">
        <i class="fas me-2" [class.fa-check-circle]="feedback.correcto" [class.fa-times-circle]="!feedback.correcto"></i>
        {{ feedback.correcto ? '¡Correcto! +1 moneda' : 'Incorrecto: ' + feedback.explicacion }}
      </div>

      <button (click)="responder()" class="btn btn-success btn-lg w-100"
              [disabled]="!respuesta.trim() || !!feedback">
        <i class="fas fa-check me-2"></i>Responder
      </button>
    </div>
  </div>

</div>
