<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)">
  <div class="card shadow-lg" style="width: 420px">
    <div class="card-body p-5">

      <div class="text-center mb-4">
        <i class="fas fa-star fa-3x text-warning mb-3"></i>
        <h4 class="fw-bold">¡Bienvenido!</h4>
        <p class="text-muted">Ingresa tu nombre y PIN de 4 dígitos</p>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        <i class="fas fa-exclamation-triangle"></i> {{ error }}
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label fw-bold">Tu nombre</label>
          <input type="text" formControlName="nombre" class="form-control form-control-lg"
                 [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched"
                 placeholder="¿Cómo te llamas?">
          <div class="invalid-feedback">Ingresa tu nombre</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">PIN (4 dígitos)</label>
          <input type="password" formControlName="pin" class="form-control form-control-lg text-center"
                 [class.is-invalid]="form.get('pin')?.invalid && form.get('pin')?.touched"
                 placeholder="••••" maxlength="4" inputmode="numeric">
          <div class="invalid-feedback">El PIN debe tener 4 dígitos</div>
        </div>

        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!loading" class="fas fa-play me-2"></i>
          {{ loading ? 'Entrando...' : '¡Entrar a Jugar!' }}
        </button>
      </form>

      <div class="text-center mt-3">
        <a routerLink="/auth/login" class="text-muted small">
          <i class="fas fa-arrow-left"></i> Soy profesor o padre
        </a>
      </div>

    </div>
  </div>
</div>
