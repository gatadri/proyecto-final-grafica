<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow" style="width: 420px">
    <div class="card-body p-5">

      <div class="text-center mb-4">
        <i class="fas fa-graduation-cap fa-3x text-primary mb-3"></i>
        <h4 class="fw-bold">Sistema Educativo</h4>
        <p class="text-muted">Ingresa con tu cuenta</p>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        <i class="fas fa-exclamation-triangle"></i> {{ error }}
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label fw-bold">Correo electrónico</label>
          <input type="email" formControlName="email" class="form-control"
                 [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
                 placeholder="correo@ejemplo.com">
          <div class="invalid-feedback">Ingresa un correo válido</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Contraseña</label>
          <input type="password" formControlName="password" class="form-control"
                 [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
                 placeholder="••••••••">
          <div class="invalid-feedback">La contraseña es requerida</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!loading" class="fas fa-sign-in-alt me-2"></i>
          {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
        </button>
      </form>

      <!-- TEMPORAL: Botones para login rápido con usuarios falsos -->
      <div class="mt-3">
        <p class="text-muted small text-center">Login rápido (temporal):</p>
        <div class="d-grid gap-2">
          <button class="btn btn-outline-secondary btn-sm" (click)="quickLogin('director@test.com', '1234')">
            <i class="fas fa-user-tie me-1"></i> Director
          </button>
          <button class="btn btn-outline-secondary btn-sm" (click)="quickLogin('profesor@test.com', '1234')">
            <i class="fas fa-chalkboard-teacher me-1"></i> Profesor
          </button>
          <button class="btn btn-outline-secondary btn-sm" (click)="quickLogin('padre@test.com', '1234')">
            <i class="fas fa-user-friends me-1"></i> Padre
          </button>
        </div>
      </div>

      <hr class="my-4">

      <div class="text-center">
        <a routerLink="/auth/nino-login" class="btn btn-outline-success w-100">
          <i class="fas fa-child me-2"></i> Soy un Estudiante
        </a>
      </div>

    </div>
  </div>
</div>
