<h5 class="fw-bold mb-4"><i class="fas fa-users text-primary me-2"></i>Gestión de Usuarios</h5>

<div *ngIf="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

<div *ngIf="!loading" class="card">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of usuarios">
            <td><strong>{{ u.nombre }} {{ u.apellido }}</strong></td>
            <td>{{ u.email }}</td>
            <td>
              <span class="badge"
                [class.bg-primary]="u.role === 'director'"
                [class.bg-success]="u.role === 'profesor'"
                [class.bg-warning]="u.role === 'padre'">
                {{ u.role | titlecase }}
              </span>
            </td>
            <td>
              <span class="badge" [class.bg-success]="u['activo']" [class.bg-danger]="!u['activo']">
                {{ u['activo'] ? 'Activo' : 'Suspendido' }}
              </span>
            </td>
            <td>
              <button *ngIf="u['activo']" (click)="suspender(u.id)" class="btn btn-sm btn-outline-danger me-1">
                <i class="fas fa-ban"></i>
              </button>
              <button *ngIf="!u['activo']" (click)="activar(u.id)" class="btn btn-sm btn-outline-success me-1">
                <i class="fas fa-check"></i>
              </button>
              <button (click)="eliminar(u.id)" class="btn btn-sm btn-outline-danger">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
