<div class="companion-bubble">
  <!-- Burbuja de mensaje -->
  <div class="speech-bubble" [class.visible]="mensajeVisible">
    {{ mensajeActual }}
  </div>

  <!-- Cuerpo del personaje -->
  <div class="character-wrap" [ngClass]="['expr-' + expresion, 'monster-' + avatar.tipo]">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" class="character-svg">
      <defs>
        <radialGradient id="monsterGrad" cx="35%" cy="35%" r="60%">
          <stop offset="0%"   [attr.stop-color]="lighten(avatar.color)" stop-opacity="1"/>
          <stop offset="100%" [attr.stop-color]="avatar.color" stop-opacity="1"/>
        </radialGradient>
        <filter id="monsterShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
        </filter>
      </defs>

      <!-- Sombra suelo -->
      <ellipse cx="60" cy="115" rx="35" ry="5" fill="rgba(0,0,0,0.15)"/>

      <!-- CUERPO SEGÚN TIPO -->
      <g [ngSwitch]="avatar.tipo" filter="url(#monsterShadow)">
        <!-- Blob (Gloop) -->
        <path *ngSwitchCase="'blob'" 
              d="M30 40 Q30 20 60 20 Q90 20 90 40 Q90 80 80 95 Q60 110 40 95 Q30 80 30 40" 
              fill="url(#monsterGrad)"/>
        
        <!-- Horn (Zorg) -->
        <g *ngSwitchCase="'horn'">
          <path d="M30 30 L45 10 L50 30 Z" [attr.fill]="darken(avatar.color)"/>
          <path d="M90 30 L75 10 L70 30 Z" [attr.fill]="darken(avatar.color)"/>
          <rect x="30" y="30" width="60" height="70" rx="15" fill="url(#monsterGrad)"/>
        </g>

        <!-- Fluff (Fluff) -->
        <g *ngSwitchCase="'fluff'">
          <circle cx="60" cy="60" r="45" fill="url(#monsterGrad)"/>
          <!-- "Pelos" decorativos -->
          <circle *ngFor="let i of [0,45,90,135,180,225,270,315]" 
                  [attr.cx]="60 + 42 * cos(i)" 
                  [attr.cy]="60 + 42 * sin(i)" 
                  r="12" [attr.fill]="avatar.color"/>
        </g>

        <!-- Ear (Pip) -->
        <g *ngSwitchCase="'ear'">
          <ellipse cx="40" cy="30" rx="15" ry="25" [attr.fill]="avatar.color" transform="rotate(-20, 40, 30)"/>
          <ellipse cx="80" cy="30" rx="15" ry="25" [attr.fill]="avatar.color" transform="rotate(20, 80, 30)"/>
          <circle cx="60" cy="70" r="40" fill="url(#monsterGrad)"/>
        </g>
      </g>

      <!-- CARA -->
      <g class="face">
        <!-- OJOS -->
        <g class="eyes">
          <!-- Ojo izquierdo -->
          <g transform="translate(42, 50)">
            <ng-container [ngSwitch]="expresion">
              <!-- Alegre: ^ -->
              <path *ngSwitchCase="'alegre'" d="M-8 4 Q0 -8 8 4" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
              <!-- Sorprendido: O -->
              <circle *ngSwitchCase="'sorprendido'" r="12" fill="white" stroke="#1e293b" stroke-width="1"/>
              <circle *ngSwitchCase="'sorprendido'" r="6" fill="#1e293b"/>
              <!-- Normal / Otros -->
              <ng-container *ngSwitchDefault>
                <ellipse cx="0" cy="0" rx="10" ry="12" fill="white"/>
                <circle [attr.cx]="parpadeando ? 0 : 2" [attr.cy]="parpadeando ? 0 : 2" r="5" fill="#1e293b"/>
                <circle cx="3" cy="-3" r="2" fill="white" opacity="0.8"/>
                <rect *ngIf="parpadeando" x="-10" y="-12" width="20" height="24" [attr.fill]="avatar.color"/>
              </ng-container>
            </ng-container>
          </g>
          <!-- Ojo derecho -->
          <g transform="translate(78, 50)">
            <ng-container [ngSwitch]="expresion">
              <!-- Alegre: ^ -->
              <path *ngSwitchCase="'alegre'" d="M-8 4 Q0 -8 8 4" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
              <!-- Sorprendido: O -->
              <circle *ngSwitchCase="'sorprendido'" r="12" fill="white" stroke="#1e293b" stroke-width="1"/>
              <circle *ngSwitchCase="'sorprendido'" r="6" fill="#1e293b"/>
              <!-- Normal / Otros -->
              <ng-container *ngSwitchDefault>
                <ellipse cx="0" cy="0" rx="10" ry="12" fill="white"/>
                <circle [attr.cx]="parpadeando ? 0 : -2" [attr.cy]="parpadeando ? 0 : 2" r="5" fill="#1e293b"/>
                <circle cx="-3" cy="-3" r="2" fill="white" opacity="0.8"/>
                <rect *ngIf="parpadeando" x="-10" y="-12" width="20" height="24" [attr.fill]="avatar.color"/>
              </ng-container>
            </ng-container>
          </g>
        </g>

        <!-- BOCA SEGÚN EXPRESIÓN -->
        <g class="mouth" [ngSwitch]="expresion" transform="translate(60, 75)">
          <!-- Feliz -->
          <path *ngSwitchDefault d="M-15 5 Q0 20 15 5" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
          
          <!-- Alegre -->
          <path *ngSwitchCase="'alegre'" d="M-18 0 Q0 25 18 0 Z" fill="#ff6b9d" stroke="#1e293b" stroke-width="3"/>
          
          <!-- Triste -->
          <path *ngSwitchCase="'triste'" d="M-12 15 Q0 0 12 15" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
          
          <!-- Sorprendido -->
          <circle *ngSwitchCase="'sorprendido'" r="8" fill="#1e293b"/>
          
          <!-- Enojado -->
          <path *ngSwitchCase="'enojado'" d="M-15 10 L0 5 L15 10" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
          
          <!-- Pensando -->
          <path *ngSwitchCase="'pensando'" d="M-10 5 H10" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Detalle extra: coloretes -->
      <g opacity="0.4" *ngIf="expresion === 'alegre' || expresion === 'feliz'">
        <circle cx="35" cy="65" r="6" fill="#ff8fab"/>
        <circle cx="85" cy="65" r="6" fill="#ff8fab"/>
      </g>
    </svg>
  </div>

  <!-- Nombre -->
  <div class="companion-name" [style.background]="avatar.color">
    {{ displayName ?? avatar.nombre }}
  </div>
</div>
