<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold"><i class="fas fa-store text-primary me-2"></i>Tienda</h4>
    <div>
      <a routerLink="/nino/dashboard" class="btn btn-outline-secondary btn-sm me-2">
        <i class="fas fa-arrow-left"></i> Volver
      </a>
      <span class="badge bg-warning text-dark fs-6">
        <i class="fas fa-coins me-1"></i>{{ nino.monedas }} monedas
      </span>
    </div>
  </div>

  <div *ngIf="mensaje" class="alert alert-{{ mensaje.tipo }} alert-dismissible">
    {{ mensaje.texto }}
  </div>

  <div *ngIf="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

  <div *ngIf="!loading">

    <!-- Skins -->
    <div class="card mb-4">
      <div class="card-header fw-bold">
        <i class="fas fa-user-circle text-primary me-2"></i>Skins de Avatar
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div *ngFor="let s of skins" class="col-md-3 col-6">
            <div class="card text-center h-100 skin-card">
              <div class="card-body">
                <img [src]="'/images/avatares/' + s.imagen" width="60" height="60"
                     class="rounded-circle border mb-2">
                <h6 class="fw-bold">{{ s.nombre }}</h6>
                <small class="text-muted d-block mb-2">{{ s.descripcion }}</small>
                <span class="badge mb-2"
                  [class.bg-secondary]="s.rareza==='comun'"
                  [class.bg-primary]="s.rareza==='raro'"
                  [class.bg-warning]="s.rareza==='legendario'">
                  {{ s.rareza | titlecase }}
                </span>

                <div *ngIf="tieneSkin(s.id)">
                  <span class="badge bg-success w-100"><i class="fas fa-check me-1"></i>Obtenida</span>
                </div>
                <div *ngIf="!tieneSkin(s.id)">
                  <button (click)="comprarSkin(s)"
                          class="btn btn-sm w-100"
                          [class.btn-success]="s.precio === 0"
                          [class.btn-primary]="s.precio > 0"
                          [disabled]="s.precio > 0 && nino.monedas < s.precio">
                    <i class="fas fa-coins me-1"></i>
                    {{ s.precio === 0 ? 'Gratis' : s.precio }}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Stickers -->
    <div class="card">
      <div class="card-header fw-bold">
        <i class="fas fa-star text-warning me-2"></i>Stickers Imprimibles
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div *ngFor="let s of stickers" class="col-md-3 col-6">
            <div class="card text-center h-100">
              <div class="card-body">
                <img [src]="'/images/stickers/' + s.imagen" width="60" height="60"
                     class="rounded border mb-2">
                <h6 class="fw-bold">{{ s.nombre }}</h6>
                <small class="text-muted d-block mb-2">{{ s.descripcion }}</small>

                <div *ngIf="tieneSticker(s.id)" class="d-grid gap-1">
                  <span class="badge bg-success"><i class="fas fa-check me-1"></i>Comprado</span>
                  <button (click)="descargarSticker(s.id)" class="btn btn-outline-primary btn-sm">
                    <i class="fas fa-download me-1"></i>Descargar PDF
                  </button>
                </div>
                <div *ngIf="!tieneSticker(s.id)">
                  <button (click)="comprarSticker(s)"
                          class="btn btn-warning btn-sm w-100"
                          [disabled]="nino.monedas < s.precio">
                    <i class="fas fa-coins me-1"></i>{{ s.precio }}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
